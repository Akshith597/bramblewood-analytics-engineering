<svg xmlns="http://www.w3.org/2000/svg" width="960" height="484" viewBox="0 0 960 484" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Net sales and gross margin by subcategory, comparable stores</title><desc>Trail Mix (+26%) and Kettle Chips (+9%) grew fastest; Nuts gave up the most margin (-3.2 pp).</desc>
