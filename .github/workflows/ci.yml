name: Warehouse quality gate
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
jobs:
  # Needs no built warehouse, so it runs alongside the build instead of after it.
  static-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Install dbt packages for the SQLFluff dbt templater
        run: python scripts/invoke_dbt.py deps
      - name: Unit tests — macros, evidence references, chart helpers, public-claim guards
        run: python -m unittest discover -s tests_python -v
      - name: SQLFluff (the dbt templater opens an empty local DuckDB file)
        run: |
          mkdir -p warehouse
          python scripts/lint_sql.py
      - run: python -m pre_commit run --all-files

  warehouse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Ingest, source freshness, dbt build, reconciliation, docs, evidence and charts
        run: python scripts/run_all.py
      - name: Decision analyses, FY2026 plan, scorecard and public documents
        run: python -m analysis.run
      - name: No stale public claim — results, memo, plan, scorecard, README and chart figures must match the committed versions
        run: git diff --exit-code -- analysis/results docs README.md evidence/insights_figures.json docs/assets/insights
      - name: Repeatability — full reload, incremental rebuild, identical model hashes
        run: python scripts/verify_repeatability.py
      - name: Incremental change cases — changed, deleted and late rows, deleted weeks, empty target
        run: python scripts/verify_incremental.py
      - name: Hand the estimation panels to the R cross-check
        uses: actions/upload-artifact@v7
        with:
          name: analysis-panels
          path: target/analysis_panels/
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: warehouse-quality-evidence
          path: |
            target/manifest.json
            target/run_results.json
            target/sources.json
            target/catalog.json
            target/insights.html
            analysis/results/
            docs/decision_memo.md
            docs/fy2026_plan.md
            docs/scorecard.md
            README.md
            docs/assets/insights/
            evidence/

  r-crosscheck:
    needs: warehouse
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install fixest and jsonlite (cached between runs)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::fixest
            any::jsonlite
      - uses: actions/download-artifact@v8
        with:
          name: analysis-panels
          path: target/analysis_panels
      - name: Independent R fixest cross-check against the committed analysis results
        run: Rscript analysis/crosscheck.R
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: crosscheck-fixest
          path: target/crosscheck_fixest.json
