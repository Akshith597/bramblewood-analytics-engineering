name: Publish dbt documentation

# Deploys the site that the quality gate built and verified. It runs only after every job of that workflow has
# passed on main, and it downloads the gate's `pages-site` artifact instead of rebuilding, so what is published is
# exactly what was checked. A failing gate leaves the live site unchanged.
on:
  workflow_run:
    workflows: [Warehouse quality gate]
    types: [completed]
    branches: [main]
  # Manual run: redeploys the site from the latest passing gate run on main (its artifact is kept for 30 days).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Find the passing gate run to publish
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGERING_RUN: ${{ github.event.workflow_run.id }}
        run: |
          run_id="$TRIGGERING_RUN"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No passing quality gate run on main to publish" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download the site the gate verified
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-site
          path: public_site
          run-id: ${{ steps.gate.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload static documentation
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public_site
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
