name: Publication recovery drill
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-drill
  cancel-in-progress: false
env:
  DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
jobs:
  drill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Publish, detect a stale source, refuse a tampered batch, recover
        run: python scripts/recovery_drill.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: recovery-drill
          path: |
            target/recovery_drill.json
            warehouse/drill/current.json
            warehouse/drill/releases/*/release.json
