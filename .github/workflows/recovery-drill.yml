name: Publication recovery drill
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-drill
  cancel-in-progress: false
env:
  DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
jobs:
  drill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Publish, detect a stale source, refuse a tampered batch, recover
        run: python scripts/recovery_drill.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: recovery-drill
          path: |
            target/recovery_drill.json
            warehouse/drill/current.json
            warehouse/drill/releases/*/release.json
