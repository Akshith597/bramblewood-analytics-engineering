repos:
  - repo: local
    hooks:
      - id: sqlfluff-lint
        name: SQLFluff (dbt / DuckDB)
        entry: python -m sqlfluff lint
        language: system
        require_serial: true
        types: [sql]
        files: ^(models|tests|analyses)/.*\.sql$
      - id: ruff-check
        name: Ruff lint (Python)
        entry: python -m ruff check scripts analysis tests_python
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: Ruff format (scripts)
        entry: python -m ruff format --check scripts
        language: system
        pass_filenames: false
        types: [python]
