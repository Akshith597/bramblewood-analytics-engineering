version: 2
unit_tests:
- name: normalizes_dates_keys_and_preserves_returns
  model: stg_pos_audit
  given:
  - input: source('raw', 'pos_weekly_sales')
    rows:
    - store_nbr: '109'
      upc: '41230001146'
      week_ending: 02/10/2024
      units: '-2'
      gross_sales: '-6.58'
      promo_discount: '0.00'
      net_sales: '-6.58'
      _source_row: 2
      _source_file: fixture.csv
  expect:
    rows:
    - store_id: 109
      normalized_upc: '041230001146'
      parsed_week_ending: '2024-02-10'
      parsed_units: -2
      parsed_net_sales: -6.58
      disposition: accepted
- name: separates_replays_headers_and_invalid_records
  model: stg_pos_audit
  given:
  - input: source('raw', 'pos_weekly_sales')
    rows:
    - store_nbr: '101'
      upc: '812450001342'
      week_ending: '2024-02-10'
      units: '2'
      gross_sales: '8.00'
      promo_discount: '0.00'
      net_sales: '8.00'
      _source_row: 2
      _source_file: fixture.csv
    - store_nbr: '101'
      upc: '812450001342'
      week_ending: '2024-02-10'
      units: '2'
      gross_sales: '8.00'
      promo_discount: '0.00'
      net_sales: '8.00'
      _source_row: 3
      _source_file: fixture.csv
    - store_nbr: store_nbr
      upc: upc
      week_ending: week_ending
      units: units
      gross_sales: gross_sales
      promo_discount: promo_discount
      net_sales: net_sales
      _source_row: 4
      _source_file: fixture.csv
    - store_nbr: '101'
      upc: '812450001342'
      week_ending: bad-date
      units: '2'
      gross_sales: '8.00'
      promo_discount: '0.00'
      net_sales: '8.00'
      _source_row: 5
      _source_file: fixture.csv
  expect:
    rows:
    - _source_row: 2
      disposition: accepted
    - _source_row: 3
      disposition: exact_replay
    - _source_row: 4
      disposition: embedded_header
    - _source_row: 5
      disposition: invalid_record
- name: labels_blank_malformed_and_header_inventory_rows
  model: stg_inventory_audit
  given:
  - input: source('raw', 'store_inventory_weekly')
    rows:
    - store_id: '101'
      sku_id: SS-1001
      fiscal_week: FY2024-W01
      receipts_units: ' 48 '
      on_hand_eow: '0'
      _source_row: 2
      _source_file: fixture.csv
    - store_id: '101'
      sku_id: SS-1001
      fiscal_week: FY2024-W01
      receipts_units: '48'
      on_hand_eow: ''
      _source_row: 3
      _source_file: fixture.csv
    - store_id: '101'
      sku_id: SS-1001
      fiscal_week: FY2024-W01
      receipts_units: n/a
      on_hand_eow: '14'
      _source_row: 4
      _source_file: fixture.csv
    - store_id: store_id
      sku_id: sku_id
      fiscal_week: fiscal_week
      receipts_units: receipts_units
      on_hand_eow: on_hand_eow
      _source_row: 5
      _source_file: fixture.csv
    - store_id: '101'
      sku_id: SS-1001
      fiscal_week: 2024-W01
      receipts_units: '48'
      on_hand_eow: '14'
      _source_row: 6
      _source_file: fixture.csv
    - store_id: 10A
      sku_id: SS-1001
      fiscal_week: FY2024-W01
      receipts_units: '48'
      on_hand_eow: '14'
      _source_row: 7
      _source_file: fixture.csv
  expect:
    rows:
    - _source_row: 2
      store_id: 101
      week_key: FY2024-W01
      receipts_units: 48
      on_hand_eow: 0
      disposition: accepted
    - _source_row: 3
      store_id: 101
      week_key: FY2024-W01
      receipts_units: 48
      on_hand_eow: null
      disposition: missing_quantity
    - _source_row: 4
      store_id: 101
      week_key: FY2024-W01
      receipts_units: null
      on_hand_eow: 14
      disposition: invalid_record
    - _source_row: 5
      store_id: null
      week_key: fiscal_week
      receipts_units: null
      on_hand_eow: null
      disposition: embedded_header
    - _source_row: 6
      store_id: 101
      week_key: 2024-W01
      receipts_units: 48
      on_hand_eow: 14
      disposition: invalid_record
    - _source_row: 7
      store_id: null
      week_key: FY2024-W01
      receipts_units: 48
      on_hand_eow: 14
      disposition: invalid_record
- name: orders_swapped_promotion_dates_and_flags_them
  model: stg_promotions
  given:
  - input: source('raw', 'promotions')
    rows:
    - promo_id: PR-25-0432
      start_date: '2025-04-12'
      end_date: '2025-03-30'
      _source_row: 2
      _source_file: fixture.xlsx
    - promo_id: PR-25-0001
      start_date: '2025-01-05'
      end_date: '2025-01-18'
      _source_row: 3
      _source_file: fixture.xlsx
  expect:
    rows:
    - promo_id: PR-25-0432
      start_date: '2025-03-30'
      end_date: '2025-04-12'
      source_start_date: '2025-04-12'
      source_end_date: '2025-03-30'
      dates_swapped: true
    - promo_id: PR-25-0001
      start_date: '2025-01-05'
      end_date: '2025-01-18'
      source_start_date: '2025-01-05'
      source_end_date: '2025-01-18'
      dates_swapped: false
