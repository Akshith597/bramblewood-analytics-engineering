    description: Metro, Suburban or Value store pricing zone.
  - name: effective_start
    data_type: date
    description: Inclusive first DATE on which this period applies.
    data_tests:
    - not_null
  - name: effective_end
    data_type: date
    description: Inclusive last DATE on which this period applies; null means open ended.
  - name: reg_retail
    data_type: decimal(18,2)
    description: Effective regular per-unit shelf price in USD by SKU and zone.
  - name: _source_file
    data_type: varchar
    description: Original extract filename retained for row-level traceability.
  - name: _source_row
    data_type: bigint
    description: Original extract row number; headers occupy row 1 in each file or sheet.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - sku_id
        - price_zone
