version: 2
models:
- name: audit_reconciliation
  description: One POS disposition with row, signed-unit and dollar control totals; malformed header measures remain
    null.
  columns:
  - name: disposition
    data_type: varchar
    description: 'Original POS row classification: accepted, embedded_header, exact_replay or invalid_record.'
    data_tests:
    - unique
    - not_null
    constraints:
    - type: not_null
  - name: source_rows
    data_type: bigint
    description: Number of original POS rows assigned to this disposition.
  - name: net_sales
    data_type: decimal(18,2)
    description: USD paid by shoppers after promotional discount; returns remain signed.
  - name: units
    data_type: bigint
    description: Signed net units sold after returns; negative values are valid return records.
  config:
    contract:
      enforced: true
- name: dim_item
  description: One current-master SKU, with normalized UPC, canonical subcategory, brand, supplier, size and lifecycle.
    Replacement SKUs remain separate. Type 1 dimension.
  columns:
  - name: sku_id
    data_type: varchar
    description: Internal product SKU identifier; replacement pack sizes retain distinct keys.
    data_tests:
    - unique
    - not_null
    constraints:
    - type: not_null
  - name: upc
    data_type: varchar
    description: 12-character UPC string normalized by normalize_upc; leading zeroes are significant.
    data_tests:
    - unique
    - not_null
    constraints:
    - type: not_null
  - name: description
    data_type: varchar
    description: Description. Recorded in the supplied master data.
  - name: brand
    data_type: varchar
    description: Brand. Recorded in the supplied master data.
  - name: vendor_id
    data_type: varchar
    description: Vendor master identifier; joins to dim_vendor.vendor_id.
  - name: category
    data_type: varchar
    description: Category. Recorded in the supplied master data.
  - name: subcategory
    data_type: varchar
    description: Canonical salty-snacks subcategory; whitespace/case variant of Tortilla Chips is standardized.
  - name: brand_type
    data_type: varchar
    description: National, Regional, Private Label or Value classification from the item master.
  - name: flavor
    data_type: varchar
    description: Flavor. Recorded in the supplied master data.
  - name: size_desc
    data_type: varchar
    description: Size desc. Recorded in the supplied master data.
  - name: size_oz
    data_type: decimal(8,2)
    description: Size oz. Recorded in the supplied master data.
  - name: case_pack
    data_type: integer
    description: Case pack. Recorded in the supplied master data.
  - name: launch_date
    data_type: date
    description: Launch date. Recorded in the supplied master data.
  - name: discontinue_date
    data_type: date
    description: Discontinue date. Recorded in the supplied master data.
  - name: replaces_sku
    data_type: varchar
    description: Replaces sku. Recorded in the supplied master data.
  - name: status
    data_type: varchar
    description: 'Item lifecycle status: Active or Discontinued.'
  config:
    contract:
      enforced: true
- name: dim_store
  description: One current-master store, with format, zone, POS system and DATE-typed opening/remodel dates. Type
    1 dimension.
  columns:
  - name: store_id
    data_type: integer
    description: Store master identifier used consistently across sales, inventory and planograms.
    data_tests:
    - unique
    - not_null
    constraints:
    - type: not_null
  - name: store_name
    data_type: varchar
    description: Store name. Recorded in the supplied master data.
  - name: city
    data_type: varchar
    description: City. Recorded in the supplied master data.
  - name: state
    data_type: varchar
    description: State. Recorded in the supplied master data.
  - name: format
    data_type: varchar
    description: Format. Recorded in the supplied master data.
  - name: sqft
    data_type: integer
    description: Sqft. Recorded in the supplied master data.
  - name: price_zone
    data_type: varchar
    description: Metro, Suburban or Value store pricing zone.
  - name: pos_system
    data_type: varchar
    description: Pos system. Recorded in the supplied master data.
  - name: open_date
    data_type: date
    description: Open date. Recorded in the supplied master data.
  - name: remodel_start
    data_type: date
    description: Remodel start. Recorded in the supplied master data.
  - name: remodel_end
    data_type: date
    description: Remodel end. Recorded in the supplied master data.
  config:
    contract:
      enforced: true
- name: dim_vendor
  description: One current-master vendor with invented supplier name and recorded payment terms. Type 1 dimension.
  columns:
  - name: vendor_id
    data_type: varchar
    description: Vendor master identifier; joins to dim_vendor.vendor_id.
    data_tests:
    - unique
    - not_null
    constraints:
    - type: not_null
  - name: vendor_name
    data_type: varchar
    description: Vendor name. Recorded in the supplied master data.
  - name: payment_terms
    data_type: varchar
    description: Payment terms. Recorded in the supplied master data.
  config:
    contract:
      enforced: true
- name: dim_week
  description: One authoritative fiscal week with DATE-typed Sunday start and Saturday end, 4-5-4 periods and selling
    events.
  columns:
  - name: week_key
    data_type: varchar
    description: Authoritative FYyyyy-Www fiscal week key; joins to dim_week.week_key.
    data_tests:
    - unique
    - not_null
    constraints:
    - type: not_null
  - name: week_start
    data_type: date
    description: Sunday DATE starting the fiscal selling week.
  - name: week_ending
    data_type: date
    description: Saturday DATE closing the Sunday-Saturday selling week.
  - name: fiscal_year
    data_type: integer
    description: Fiscal year. Recorded in the supplied master data.
  - name: fiscal_quarter
    data_type: integer
    description: Fiscal quarter. Recorded in the supplied master data.
  - name: fiscal_period
    data_type: integer
    description: Fiscal period. Recorded in the supplied master data.
  - name: fiscal_week
    data_type: integer
    description: Fiscal week. Recorded in the supplied master data.
  - name: holiday_event
    data_type: varchar
    description: Holiday event. Recorded in the supplied master data.
  config:
    contract:
      enforced: true
- name: fct_inventory
  description: One store-SKU-fiscal-week observed inventory snapshot. Zero-stock refers only to Saturday closing
    stock, not weekly stockout duration.
  columns:
  - name: inventory_key
    data_type: varchar
    description: Deterministic MD5 of the store-SKU-week observed inventory key.
    data_tests:
    - unique
    - not_null
    constraints:
    - type: not_null
  - name: store_id
    data_type: integer
    description: Store master identifier used consistently across sales, inventory and planograms.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_store')
          field: store_id
    constraints:
    - type: not_null
  - name: sku_id
    data_type: varchar
    description: Internal product SKU identifier; replacement pack sizes retain distinct keys.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_item')
          field: sku_id
    constraints:
    - type: not_null
  - name: week_key
    data_type: varchar
    description: Authoritative FYyyyy-Www fiscal week key; joins to dim_week.week_key.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_week')
          field: week_key
    constraints:
    - type: not_null
  - name: receipts_units
    data_type: integer
    description: Units received into the store during the fiscal week.
  - name: on_hand_eow
    data_type: integer
    description: Store units on hand at Saturday close; excludes DC inventory.
  - name: _source_file
    data_type: varchar
    description: Original extract filename retained for row-level traceability.
  - name: _source_row
    data_type: bigint
    description: Original extract row number; headers occupy row 1 in each file or sheet.
  - name: zero_stock_snapshot
    data_type: boolean
    description: True only for an observed Saturday stock value of zero; missing inventory is null in the union
      mart.
  config:
    contract:
      enforced: true
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - store_id
        - sku_id
        - week_key
- name: fct_sales
  description: One store-SKU-fiscal-week POS record. Signed returns are retained. Estimated list-cost COGS and pre-funding
    gross profit use effective cost as of Saturday.
  columns:
  - name: sales_key
    data_type: varchar
    description: Deterministic MD5 of store_id, sku_id and week_key; identifies a single accepted sales row.
    data_tests:
    - unique
    - not_null
    constraints:
    - type: not_null
  - name: store_id
    data_type: integer
    description: Store master identifier used consistently across sales, inventory and planograms.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_store')
          field: store_id
    constraints:
    - type: not_null
  - name: upc
    data_type: varchar
    description: 12-character UPC string normalized by normalize_upc; leading zeroes are significant.
  - name: week_ending
    data_type: date
    description: Saturday DATE closing the Sunday-Saturday selling week.
  - name: units
    data_type: integer
    description: Signed net units sold after returns; negative values are valid return records.
    data_tests:
    - not_null
    constraints:
    - type: not_null
  - name: gross_sales
    data_type: decimal(18,2)
    description: USD at regular shelf prices before promotional discount.
  - name: promo_discount
    data_type: decimal(18,2)
    description: Promotional markdown in USD recorded at the register.
  - name: net_sales
    data_type: decimal(18,2)
    description: USD paid by shoppers after promotional discount; returns remain signed.
    data_tests:
    - not_null
    constraints:
    - type: not_null
  - name: _source_file
    data_type: varchar
    description: Original extract filename retained for row-level traceability.
  - name: _source_row
    data_type: bigint
    description: Original extract row number; headers occupy row 1 in each file or sheet.
  - name: sku_id
    data_type: varchar
    description: Internal product SKU identifier; replacement pack sizes retain distinct keys.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_item')
          field: sku_id
    constraints:
    - type: not_null
  - name: week_key
    data_type: varchar
    description: Authoritative FYyyyy-Www fiscal week key; joins to dim_week.week_key.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_week')
          field: week_key
    constraints:
    - type: not_null
  - name: fiscal_year
    data_type: integer
    description: Fiscal year. Recorded in the supplied model at its documented grain.
  - name: price_zone
    data_type: varchar
    description: Metro, Suburban or Value store pricing zone.
  - name: store_key_matched
    data_type: boolean
    description: True when the POS store resolves to the staged store master.
  - name: store_open
    data_type: boolean
    description: True when sales week ending is on or after the store opening DATE.
  - name: remodel_week
    data_type: boolean
    description: True when sales week ending falls within the supplied inclusive store remodel dates.
  - name: unit_cost
    data_type: decimal(18,2)
    description: Vendor list cost per unit in USD, fixed precision; excludes landed cost adjustments.
    data_tests:
    - not_null
    constraints:
    - type: not_null
  - name: regular_unit_price
    data_type: decimal(18,2)
    description: Effective regular shelf price for the store price zone at week ending, USD.
    data_tests:
    - not_null
    constraints:
    - type: not_null
  - name: estimated_cogs
    data_type: decimal(18,2)
    description: Signed net units multiplied by week-end effective list cost, USD.
  - name: gross_profit_before_funding
    data_type: decimal(18,2)
    description: Net sales less estimated list-cost COGS, USD; excludes funding and operational costs.
  config:
    contract:
      enforced: true
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - store_id
        - sku_id
        - week_key
- name: fct_vendor_claims
  description: One claim with billed scan/display terms and collected cash in the extract. Collection timestamps
    are unavailable; balances are not historical as-of receivables.
  columns:
  - name: claim_id
    data_type: varchar
    description: Unique vendor-claim identifier in the supplied extract.
    data_tests:
    - unique
    - not_null
    constraints:
    - type: not_null
  - name: promo_id
    data_type: varchar
    description: Promotion calendar identifier; claims may contain multiple rows for this event.
  - name: vendor_id
    data_type: varchar
    description: Vendor master identifier; joins to dim_vendor.vendor_id.
  - name: submitted_date
    data_type: date
    description: DATE claim was submitted; this is not the cash collection date.
  - name: scan_units_billed
    data_type: integer
    description: Net units recorded on the actual vendor claim.
  - name: scan_rate
    data_type: decimal(18,2)
    description: Per-unit scan-back rate used on the actual claim, USD.
  - name: scan_amount_billed
    data_type: decimal(18,2)
    description: Actual scan-back funding billed in USD.
  - name: display_fee_billed
    data_type: decimal(18,2)
    description: Actual display funding billed in USD.
  - name: total_billed
    data_type: decimal(18,2)
    description: Actual claimed funding in USD; funding mart uses zero when no claim record exists.
  - name: status
    data_type: varchar
    description: 'Claim state in the extract: Paid or Disputed.'
  - name: amount_collected
    data_type: decimal(18,2)
    description: Collected funding in USD according to the extract; no collection timestamp is supplied.
  - name: uncollected_billed_amount
    data_type: decimal(18,2)
    description: Actual billed minus collected USD; not necessarily overdue or recoverable.
  config:
    contract:
      enforced: true
- name: mart_assortment_productivity
  description: One scheduled store-SKU-week shelf allocation with observed sales and gross profit. Missing sales
    remain null; facings are planned, not observed execution.
  columns:
  - name: store_id
    data_type: integer
    description: Store master identifier used consistently across sales, inventory and planograms.
  - name: sku_id
    data_type: varchar
    description: Internal product SKU identifier; replacement pack sizes retain distinct keys.
  - name: week_key
    data_type: varchar
    description: Authoritative FYyyyy-Www fiscal week key; joins to dim_week.week_key.
  - name: facings
    data_type: integer
    description: Scheduled number of shelf faces for this item; not physically verified execution.
  - name: planogram_id
    data_type: varchar
    description: Scheduled shelf-plan identifier resolved by store and effective dates.
  - name: test_planogram
    data_type: boolean
    description: True when the scheduled planogram ID contains TEST, identifying the supplied assortment test.
  - name: has_sales_record
    data_type: boolean
    description: True when an accepted POS record exists for this key; absence is not asserted zero demand.
  - name: net_sales
    data_type: decimal(18,2)
    description: USD paid by shoppers after promotional discount; returns remain signed.
  - name: units
    data_type: integer
    description: Signed net units sold after returns; negative values are valid return records.
  - name: gross_profit_before_funding
    data_type: decimal(18,2)
    description: Net sales less estimated list-cost COGS, USD; excludes funding and operational costs.
  - name: sales_per_scheduled_facing
    data_type: double
    description: Observed net sales divided by planned facings, USD per facing for this week; null when sales missing
      or facings zero.
  config:
    contract:
      enforced: true
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - store_id
        - sku_id
        - week_key
- name: mart_availability
  description: One key in the union of sales and inventory store-SKU-weeks. Presence flags preserve missing observations
    instead of filling demand with zeros.
  columns:
  - name: store_id
    data_type: integer
    description: Store master identifier used consistently across sales, inventory and planograms.
  - name: sku_id
    data_type: varchar
    description: Internal product SKU identifier; replacement pack sizes retain distinct keys.
  - name: week_key
    data_type: varchar
    description: Authoritative FYyyyy-Www fiscal week key; joins to dim_week.week_key.
  - name: has_sales_record
    data_type: boolean
    description: True when an accepted POS record exists for this key; absence is not asserted zero demand.
  - name: has_inventory_record
    data_type: boolean
    description: True when a store inventory extract observation exists for this key.
  - name: units
    data_type: integer
    description: Signed net units sold after returns; negative values are valid return records.
  - name: net_sales
    data_type: decimal(18,2)
    description: USD paid by shoppers after promotional discount; returns remain signed.
  - name: on_hand_eow
    data_type: integer
    description: Store units on hand at Saturday close; excludes DC inventory.
  - name: receipts_units
    data_type: integer
    description: Units received into the store during the fiscal week.
  - name: zero_stock_snapshot
    data_type: boolean
    description: True only for an observed Saturday stock value of zero; missing inventory is null in the union
      mart.
  config:
    contract:
      enforced: true
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - store_id
        - sku_id
        - week_key
- name: mart_category_weekly
  description: One canonical subcategory-fiscal-week with additive net units, sales, promotional discount and estimated
    pre-funding gross profit.
  columns:
  - name: week_key
    data_type: varchar
    description: Authoritative FYyyyy-Www fiscal week key; joins to dim_week.week_key.
  - name: fiscal_year
    data_type: integer
    description: Fiscal year. Recorded in the supplied model at its documented grain.
  - name: fiscal_week
    data_type: integer
    description: Fiscal week. Recorded in the supplied model at its documented grain.
  - name: subcategory
    data_type: varchar
    description: Canonical salty-snacks subcategory; whitespace/case variant of Tortilla Chips is standardized.
  - name: net_units
    data_type: bigint
    description: Sum of signed net units within the model grain.
  - name: net_sales
    data_type: decimal(18,2)
    description: USD paid by shoppers after promotional discount; returns remain signed.
  - name: gross_profit_before_funding
    data_type: decimal(18,2)
    description: Net sales less estimated list-cost COGS, USD; excludes funding and operational costs.
  - name: promo_discount
    data_type: decimal(18,2)
    description: Promotional markdown in USD recorded at the register.
  - name: reporting_stores
    data_type: bigint
    description: Number of distinct stores with observed sales in this model grain; not total scheduled stores.
  config:
    contract:
      enforced: true
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - subcategory
        - week_key
- name: mart_forecast_accuracy
  description: One forecast SKU-target-week with chain actuals, signed and absolute unit error, coverage and lead
    horizon. Aggregate WAPE uses ratio of sums on matched rows.
  columns:
  - name: sku_id
    data_type: varchar
    description: Internal product SKU identifier; replacement pack sizes retain distinct keys.
  - name: week_key
    data_type: varchar
    description: Authoritative FYyyyy-Www fiscal week key; joins to dim_week.week_key.
  - name: forecast_run_week
    data_type: varchar
    description: Fiscal week in which the forecast was generated; startup weeks may have shorter lead.
  - name: forecast_units
    data_type: integer
    description: Chain-level replenishment forecast net-unit quantity for the target week.
  - name: actual_units
    data_type: bigint
    description: Signed observed chain sales units aggregated to SKU-target-week before the join.
  - name: reporting_stores
    data_type: bigint
    description: Number of distinct stores with observed sales in this model grain; not total scheduled stores.
  - name: has_actual
    data_type: boolean
    description: True when the target forecast SKU-week has observed chain sales.
  - name: error_units
    data_type: bigint
    description: Forecast minus observed actual units; positive means overforecast.
  - name: absolute_error_units
    data_type: bigint
    description: Absolute forecast-minus-actual error; WAPE numerator is the sum of this field.
  - name: lead_weeks
    data_type: double
    description: Number of weeks from forecast run start to target week start; normal horizon is two.
  config:
    contract:
      enforced: true
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - sku_id
        - week_key
- name: mart_promotion_funding
  description: One promotion reconciling estimated calendar-based owed scan/display funding against actual billed
    and collected amounts. Approved event scope governs units; ambiguous assignments make owed null. Cancelled claims
    are separately flagged.
  columns:
  - name: promo_id
    data_type: varchar
    description: Promotion calendar identifier; claims may contain multiple rows for this event.
    data_tests:
    - unique
    - not_null
    constraints:
    - type: not_null
  - name: sku_id
    data_type: varchar
    description: Internal product SKU identifier; replacement pack sizes retain distinct keys.
  - name: vendor_id
    data_type: varchar
    description: Vendor master identifier; joins to dim_vendor.vendor_id.
  - name: status
    data_type: varchar
    description: 'Calendar event status: Approved or Cancelled.'
  - name: mechanic
    data_type: varchar
    description: TPR, Multi-buy or BOGO planned promotion mechanism.
  - name: store_scope
    data_type: varchar
    description: ALL or ZONE:Metro/Suburban/Value contractual store scope for the event.
  - name: start_date
    data_type: date
    description: Inclusive planned promotion start DATE.
  - name: end_date
    data_type: date
    description: Inclusive planned promotion end DATE.
  - name: display
    data_type: varchar
    description: Y/N indicator of a planned secondary display; execution is not independently observed.
  - name: eligible_sales_rows
    data_type: bigint
    description: Observed sales rows within approved SKU, dates and store scope; includes ambiguous event assignments.
  - name: unambiguous_eligible_units
    data_type: bigint
    description: Sum of signed net units assigned to exactly one approved promotion; no observations gives zero
      observed units.
  - name: ambiguous_sales_rows
    data_type: bigint
    description: Eligible sales rows matching more than one approved event; owed scan estimates are null when any
      exist.
  - name: discounted_sales_rows
    data_type: bigint
    description: Eligible rows with positive recorded promotional discount; a signal of execution, not full confirmation.
  - name: claim_count
    data_type: bigint
    description: Number of actual claim rows associated with this event after pre-aggregation.
  - name: vendor_scan_per_unit
    data_type: decimal(18,2)
    description: Per-unit contractual scan-back funding term in USD from the planned event.
  - name: vendor_display_fee
    data_type: decimal(18,2)
    description: Flat contractual display fee in USD from the planned event.
  - name: scan_funding_owed_estimate
    data_type: decimal(18,2)
    description: Estimated scan-back USD from unambiguous observed net units times contractual rate; null on ambiguity;
      zero for cancelled events.
  - name: display_funding_owed_estimate
    data_type: decimal(18,2)
    description: Estimated flat display USD once per approved event with display=Y; assumes planned placement executed.
  - name: funding_owed_estimate
    data_type: decimal(18,2)
    description: Estimated scan plus display USD under stated execution assumptions; not confirmed entitlement.
  - name: scan_amount_billed
    data_type: decimal(18,2)
    description: Actual scan-back funding billed in USD.
  - name: display_fee_billed
    data_type: decimal(18,2)
    description: Actual display funding billed in USD.
  - name: total_billed
    data_type: decimal(18,2)
    description: Actual claimed funding in USD; funding mart uses zero when no claim record exists.
  - name: amount_collected
    data_type: decimal(18,2)
    description: Collected funding in USD according to the extract; no collection timestamp is supplied.
  - name: owed_minus_billed_estimate
    data_type: decimal(18,2)
    description: Estimated owed minus actual billed USD; signed to preserve potential overbilling.
  - name: uncollected_billed_amount
    data_type: decimal(18,2)
    description: Actual billed minus collected USD; not necessarily overdue or recoverable.
  - name: owed_minus_collected_estimate
    data_type: decimal(18,2)
    description: Estimated owed minus collected USD; equals estimated billing gap plus actual collection gap.
  - name: approved_without_claim
    data_type: boolean
    description: True when an approved calendar event has no associated actual claim.
  - name: billed_on_cancelled_event
    data_type: boolean
    description: True when a cancelled event has at least one claim; review separately from approved funding gaps.
  - name: funding_estimate_status
    data_type: varchar
    description: Execution/coverage caveat classification for the estimated owed amount.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - cancelled
          - ambiguous_event_assignment
          - no_observed_sales
          - no_discount_execution_signal
          - calendar_based_estimate
  config:
    contract:
      enforced: true
